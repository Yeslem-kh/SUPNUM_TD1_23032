spring:
  datasource:
    url: jdbc:mysql://localhost:3306/td1
    username: root  # Update this to your MySQL username
    password: root  # Keep your password or update it
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL driver
  jpa:
    hibernate:
     ddl-auto: update # Maintains your current setting
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: mysql  # Changed from postgresql to mysql
    database-platform: org.hibernate.dialect.MySQLDialect  # MySQL dialect